name: Validate engine source
on:
  push:
  pull_request:
jobs:
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q engine tests alembic
      - name: Run request validation tests
        run: python -m unittest discover -s tests -v
      - name: Validate JSON request examples
        run: python -c "import json, pathlib; [json.loads(p.read_text()) for p in pathlib.Path('examples').glob('*.json')]"
